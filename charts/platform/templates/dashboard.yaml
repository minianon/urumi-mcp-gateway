{{- $d := .Values.dashboard }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: {{- include "platform.selector" (dict "root" . "name" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels: {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: dashboard
spec:
  replicas: {{ $d.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "platform.selector" (dict "root" . "name" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "platform.podSecurity" (dict "uid" 101) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}"
          imagePullPolicy: {{ $d.image.pullPolicy }}
          securityContext: {{- include "platform.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          # Endpoint removal and SIGTERM race: wait until Traefik/kube-proxy stop routing here.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources: {{- toYaml $d.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
