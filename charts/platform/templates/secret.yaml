{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- range $k := list "sessionSecret" "encryptionKey" "apiKeyPepper" "adminPassword" "postgresPassword" }}
{{- if not (index $s $k) }}
{{- fail (printf "secrets.%s is required (run scripts/gen-secrets.sh, or set secrets.existingSecret)" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.secretName" . }}
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ $s.sessionSecret | quote }}
  encryption-key: {{ $s.encryptionKey | quote }}
  api-key-pepper: {{ $s.apiKeyPepper | quote }}
  admin-password: {{ $s.adminPassword | quote }}
  postgres-password: {{ $s.postgresPassword | quote }}
  llm-api-key: {{ $s.llmApiKey | default "" | quote }}
  {{- range $slug, $token := $s.upstreamTokens }}
  upstream-{{ $slug }}-token: {{ $token | quote }}
  {{- end }}
{{- end }}
