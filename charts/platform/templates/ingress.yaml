{{- if .Values.ingress.enabled }}
# One host: the SPA at /, the gateway at /api (dashboard backend) and /mcp (MCP endpoint).
# Same origin means the session cookie can be SameSite=Strict and the dashboard needs no CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" .Release.Name) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $p := list "/api" "/mcp" }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-gateway
                port: { name: http }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-dashboard
                port: { name: http }
{{- end }}
