apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "platform.selector" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selector" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "platform.podSecurity" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext: {{- include "platform.containerSecurity" . | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: urumi
            - name: POSTGRES_DB
              value: urumi
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "platform.secretName" . }}, key: postgres-password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec: { command: ["pg_isready", "-U", "urumi", "-d", "urumi", "-h", "127.0.0.1"] }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "urumi", "-d", "urumi", "-h", "127.0.0.1"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "urumi", "-d", "urumi", "-h", "127.0.0.1"] }
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
