# One WooCommerce store per release (one namespace per store).
# Environment-specific values live in values-local.yaml / values-prod.yaml; secrets in a
# separate, git-ignored file generated by scripts/gen-secrets.sh.

store:
  name: "Urumi Demo Store"
  # Public URL of the storefront. Becomes WP_HOME/WP_SITEURL (no DB rewrite needed to move domains).
  publicUrl: "http://store.127.0.0.1.nip.io"
  timezone: "Asia/Kolkata"
  currency: "INR"
  country: "IN:KA"
  adminUser: "admin"
  adminEmail: "admin@example.com"
  sampleProducts: true

ingress:
  enabled: true
  className: traefik
  host: store.127.0.0.1.nip.io
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Credentials. Either reference a pre-created Secret (existingSecret) or let the chart create one
# from these values. Never commit real values: pass them with `-f deploy/secrets/<env>/store.yaml`.
# Keys of the Secret: db-password, db-root-password, wp-admin-password, wc-consumer-key,
# wc-consumer-secret, mcp-token
secrets:
  existingSecret: ""
  dbPassword: ""
  dbRootPassword: ""
  wpAdminPassword: ""
  wcConsumerKey: ""
  wcConsumerSecret: ""
  mcpToken: ""

persistence:
  storageClass: "" # "" = cluster default (local-path on k3s/k3d)
  mariadbSize: 2Gi
  wordpressSize: 2Gi

mariadb:
  image: mariadb:11.4.9
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

wordpress:
  image: wordpress:7.1.1-php8.3-apache
  environmentType: production
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Idempotent post-install/post-upgrade Job: installs WordPress + WooCommerce, configures the
# store, registers the MCP server's REST API key. Upgrading WooCommerce = bump this version.
setup:
  image: wordpress:cli-2.12.0-php8.3
  woocommerceVersion: "11.2.1"
  theme: storefront
  activeDeadlineSeconds: 900
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

mcp:
  enabled: true
  image:
    repository: urumi/woo-mcp
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  requestTimeoutMs: 8000
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Only pods matching this namespace + labels may call the MCP server (NetworkPolicy).
  allowedClients:
    namespace: urumi
    podLabels:
      app.kubernetes.io/name: gateway

networkPolicies:
  enabled: true
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns

imagePullSecrets: []
