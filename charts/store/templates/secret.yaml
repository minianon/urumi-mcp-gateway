{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- range $k := list "dbPassword" "dbRootPassword" "wpAdminPassword" "wcConsumerKey" "wcConsumerSecret" "mcpToken" }}
{{- if not (index $s $k) }}
{{- fail (printf "secrets.%s is required (run scripts/gen-secrets.sh, or set secrets.existingSecret)" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.secretName" . }}
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ $s.dbPassword | quote }}
  db-root-password: {{ $s.dbRootPassword | quote }}
  wp-admin-password: {{ $s.wpAdminPassword | quote }}
  wc-consumer-key: {{ $s.wcConsumerKey | quote }}
  wc-consumer-secret: {{ $s.wcConsumerSecret | quote }}
  mcp-token: {{ $s.mcpToken | quote }}
{{- end }}
