apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  clusterIP: None # headless: stable DNS for the StatefulSet pod
  selector: {{- include "store.selector" (dict "root" . "component" "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: {{ .Release.Name }}-mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "store.selector" (dict "root" . "component" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext: {{- include "store.podSecurity" (dict "uid" 999) | nindent 8 }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          securityContext: {{- include "store.containerSecurity" . | nindent 12 }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "store.secretName" . }}, key: db-password }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "store.secretName" . }}, key: db-root-password }
            - name: MARIADB_AUTO_UPGRADE
              value: "1" # run mariadb-upgrade automatically when the image version is bumped
          # healthcheck.sh ships with the official image and uses the healthcheck@localhost user
          # the entrypoint creates on first start.
          startupProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "store.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "store.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.persistence.mariadbSize }}
