# A private CA for a cluster with no public DNS (Let's Encrypt cannot reach it). cert-manager
# signs the Ingress certificates exactly as it would on a VPS; only the issuer differs.
# Trust it on your machine with: kubectl -n cert-manager get secret urumi-local-ca -o jsonpath='{.data.ca\.crt}'
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: urumi-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Urumi local CA
  secretName: urumi-local-ca
  duration: 8760h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: urumi-local-ca
spec:
  ca:
    secretName: urumi-local-ca
