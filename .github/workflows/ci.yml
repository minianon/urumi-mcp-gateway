name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [woo-mcp, supplier-mcp, gateway, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: services/${{ matrix.service }}
      - run: npx tsc --noEmit
        working-directory: services/${{ matrix.service }}
      - run: npm run build
        working-directory: services/${{ matrix.service }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint + render every chart with every environment
        run: |
          set -e
          dummy_store='--set secrets.dbPassword=x,secrets.dbRootPassword=x,secrets.wpAdminPassword=x,secrets.wcConsumerKey=x,secrets.wcConsumerSecret=x,secrets.mcpToken=x'
          dummy_mcp='--set secrets.authToken=x'
          dummy_platform='--set secrets.sessionSecret=x,secrets.encryptionKey=x,secrets.apiKeyPepper=x,secrets.adminPassword=x,secrets.postgresPassword=x'
          for env in local prod; do
            helm lint charts/store -f charts/store/values-$env.yaml $dummy_store
            helm lint charts/mcp-server -f charts/mcp-server/values-$env.yaml $dummy_mcp
            helm lint charts/platform -f charts/platform/values-$env.yaml $dummy_platform
            helm template s charts/store -f charts/store/values-$env.yaml $dummy_store > /dev/null
            helm template p charts/platform -f charts/platform/values-$env.yaml $dummy_platform > /dev/null
          done

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, helm]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [woo-mcp, supplier-mcp, gateway, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/urumi-${{ matrix.service }}:${{ github.ref_name }}
